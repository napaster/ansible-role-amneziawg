---
# defaults/main.yml - Default variables for amneziawg role

# Installation settings
# Set to false on hosts where the packages are already in place and the
# mirror is not reachable -- some routers cannot run pacman -Sy at all.
amneziawg_install: true

# Arch Linux package names. amneziawg-go is the userspace implementation and
# is kept alongside the DKMS module because both are installed on our routers.
# Debian/Ubuntu package names. amneziawg is the metapackage, amneziawg-dkms
# builds the kernel module, amneziawg-tools is the userland.
# A client does not need a fixed source port, and pinning one can collide or
# break NAT traversal. Left empty the line is omitted entirely; set it only
# on a host that actually listens.
amneziawg_listen_port: ''

amneziawg_debian_packages:
  - 'amneziawg'
  - 'amneziawg-tools'

# Ubuntu takes the packages from the upstream Launchpad PPA.
amneziawg_ubuntu_ppa: 'ppa:amnezia/ppa'

# Debian has no upstream repository. Set both to the source this host should
# use; left empty the role fails with an explanation rather than adding a
# Launchpad PPA that Debian cannot resolve.
amneziawg_apt_repo: ''
amneziawg_apt_key_url: ''
amneziawg_apt_key_path: '/etc/apt/trusted.gpg.d/amneziawg.asc'

amneziawg_archlinux_packages:
  - 'amneziawg-tools'
  - 'amneziawg-dkms'
  - 'amneziawg-go'

amneziawg_state: 'present'
amneziawg_update_cache: true
amneziawg_auto_reboot: false  # Set to true to allow automatic reboot when kernel upgrade is needed

# Interface settings
amneziawg_interface: 'awg0'
amneziawg_port: '51820'
amneziawg_remote_directory: '/etc/amnezia/amneziawg'
amneziawg_conf_owner: 'root'
amneziawg_conf_group: 'root'
amneziawg_conf_mode: '0600'
amneziawg_conf_backup: false

# Service settings
amneziawg_service_enabled: true
amneziawg_service_state: 'started'
amneziawg_interface_restart: false  # Set to true to restart instead of syncconf

# Mesh/topology settings
amneziawg_as_spoke: false  # When true, only connect to hubs (hosts with endpoints)

# Per-host settings (typically set in host_vars)
# amneziawg_addresses: []           # Required: List of VPN IP addresses with CIDR
# amneziawg_endpoint: ''            # Public endpoint (empty = client-only/spoke)
# amneziawg_private_key: ''         # Optional: provide own key, otherwise auto-generated
# amneziawg_allowed_ips: ''         # Custom AllowedIPs override
# amneziawg_persistent_keepalive: ''
# amneziawg_dns: ''
# amneziawg_mtu: ''
# amneziawg_fwmark: ''
# amneziawg_table: ''
# amneziawg_preup: []
# amneziawg_postup: []
# amneziawg_predown: []
# amneziawg_postdown: []

# AmneziaWG obfuscation parameters (define in group_vars for mesh-wide consistency)
# Junk packets (sent before handshake for obfuscation)
amneziawg_jc: 0    # Junk packet count (0 = disabled)
amneziawg_jmin: 0  # Minimum junk packet size
amneziawg_jmax: 0  # Maximum junk packet size (must be < MTU)

# Message padding
amneziawg_s1: 0  # Padding for handshake init message
amneziawg_s2: 0  # Padding for handshake response message
amneziawg_s3: 0  # Padding for transport message (AmneziaWG 1.5+)
amneziawg_s4: 0  # Padding for transport response (AmneziaWG 1.5+)

# Header obfuscation (replace WireGuard's distinctive type field)
amneziawg_h1: 0  # Header for handshake init (int or 'x-y' range)
amneziawg_h2: 0  # Header for handshake response
amneziawg_h3: 0  # Header for cookie message
amneziawg_h4: 0  # Header for transport messages

# Signature packets I1-I5 (AmneziaWG 1.5+/3.x). Free-form strings, e.g.
# '<r 3><b 0x6353...>'. Empty means the parameter is omitted entirely; these
# must match the server exactly or the handshake never completes.
amneziawg_i1: ''
amneziawg_i2: ''
amneziawg_i3: ''
amneziawg_i4: ''
amneziawg_i5: ''

# Unmanaged peers (peers not in ansible inventory)
# amneziawg_unmanaged_peers:
#   client.example.com:
#     public_key: 'xxxx'
#     allowed_ips: '10.0.0.100/32'
#     endpoint: 'client.example.com:51820'
#     persistent_keepalive: '30'
#     preshared_key: ''  # Optional
amneziawg_unmanaged_peers: {}
