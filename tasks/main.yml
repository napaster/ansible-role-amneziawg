---
# tasks/main.yml - Main entry point for amneziawg role

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - amneziawg_addresses is defined
      - amneziawg_addresses | length > 0
    fail_msg: 'amneziawg_addresses must be defined with at least one VPN address'
    quiet: true
  tags:
    - amneziawg
    - amneziawg-config

- name: Include OS-specific installation tasks
  ansible.builtin.include_tasks:
    file: '{{ amneziawg__install_tasks }}'
  vars:
    amneziawg__install_tasks_by_family:
      Debian: 'install-debian.yml'
      RedHat: 'install-redhat.yml'
      Archlinux: 'install-archlinux.yml'
    amneziawg__install_tasks: >-
      {{ amneziawg__install_tasks_by_family[ansible_os_family]
         | default('') }}
  when:
    - amneziawg_install | bool
    - amneziawg__install_tasks | length > 0
  tags:
    - amneziawg
    - amneziawg-install

# Previously every family that was not Debian fell through to the RedHat
# tasks and died inside dnf. An unknown family now says so plainly.
- name: Fail on an unsupported OS family
  ansible.builtin.fail:
    msg: "amneziawg: no installation tasks for OS family
      '{{ ansible_os_family }}'. Supported: Debian, RedHat, Archlinux.
      Set amneziawg_install: false to configure a host where the packages
      are already installed."
  when:
    - amneziawg_install | bool
    - ansible_os_family not in ['Debian', 'RedHat', 'Archlinux']
  tags:
    - amneziawg
    - amneziawg-install

- name: Generate AmneziaWG keys
  ansible.builtin.include_tasks:
    file: generate-keys.yml
  tags:
    - amneziawg
    - amneziawg-keys

- name: Configure AmneziaWG interface
  ansible.builtin.include_tasks:
    file: configure.yml
  tags:
    - amneziawg
    - amneziawg-config
