---
# tasks/install-debian.yml - Install AmneziaWG on Debian/Ubuntu via PPA

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - software-properties-common
      - gpg
      - dkms
    state: present
    update_cache: '{{ amneziawg_update_cache }}'
  become: true

- name: Check if kernel headers for current kernel are available
  ansible.builtin.shell: |
    set -euo pipefail
    apt-get install --dry-run 'linux-headers-{{ ansible_facts["kernel"] }}' 2>&1 | grep -q 'is already the newest version\|will be installed'
  args:
    executable: /bin/bash
  register: amneziawg__kernel_headers_available
  failed_when: false
  changed_when: false
  become: true

- name: Install kernel headers for current kernel
  when: amneziawg__kernel_headers_available.rc == 0
  ansible.builtin.apt:
    name: 'linux-headers-{{ ansible_facts["kernel"] }}'
    state: present
  become: true

- name: Install generic kernel headers if current kernel headers unavailable
  when: amneziawg__kernel_headers_available.rc != 0
  block:
    # linux-generic and linux-headers-generic are Ubuntu package names and do
    # not exist on Debian at all, so this fallback used to fail there with a
    # plain "no such package". On a minimal Debian install
    # linux-headers-$(uname -r) is frequently absent too, and the right answer
    # is the architecture metapackage: linux-headers-amd64 and friends.
    - name: Install kernel and headers metapackages
      ansible.builtin.apt:
        name: "{{ ['linux-generic', 'linux-headers-generic']
          if ansible_distribution == 'Ubuntu'
          else ['linux-image-' ~ amneziawg__deb_arch,
                'linux-headers-' ~ amneziawg__deb_arch] }}"
        state: present
      become: true
      vars:
        amneziawg__deb_arch: "{{ ansible_facts['architecture']
          | replace('x86_64', 'amd64')
          | replace('aarch64', 'arm64') }}"

    - name: Get latest installed kernel version
      ansible.builtin.shell: |
        set -euo pipefail
        ls -1 /lib/modules/ | sort -V | tail -1
      args:
        executable: /bin/bash
      register: amneziawg__latest_kernel
      changed_when: false

    - name: Check if reboot is required for new kernel
      ansible.builtin.set_fact:
        amneziawg__reboot_required: "{{ ansible_facts['kernel'] != amneziawg__latest_kernel.stdout }}"

    - name: Fail if reboot required but auto_reboot is disabled
      when:
        - amneziawg__reboot_required | bool
        - not amneziawg_auto_reboot | bool
      ansible.builtin.fail:
        msg: |
          Kernel upgrade required: {{ ansible_facts['kernel'] }} -> {{ amneziawg__latest_kernel.stdout }}
          A reboot is needed to load the new kernel before AmneziaWG DKMS module can be built.
          Please reboot the system manually and re-run the playbook, or set amneziawg_auto_reboot: true

    - name: Reboot to load new kernel if required
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.reboot:
        msg: "Rebooting to load new kernel for AmneziaWG DKMS"
        reboot_timeout: 300
      become: true

    - name: Wait for system to come back online
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Gather facts after reboot
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.setup:

# Ubuntu and Debian need different handling, and conflating them is how this
# silently failed before: `add-apt-repository ppa:` talks to Launchpad and
# exists only on Ubuntu, so on Debian the step added nothing at all and the
# packages then came from nowhere.
#
# There is no Debian-native AmneziaWG repository. The working approach is to
# point Debian at the Launchpad PPA directly, using the nearest Ubuntu suite:
# bookworm -> focal, trixie -> noble. Suites that publish no packages return
# 404 on dists/<suite>/Release, so an unknown codename falls back to noble,
# which is the LTS the DKMS module builds against cleanly.
- name: Work out which PPA suite to use
  ansible.builtin.set_fact:
    amneziawg__ppa_suite: >-
      {{ ansible_facts['distribution_release']
         if ansible_distribution == 'Ubuntu'
         else amneziawg_debian_ppa_suite_map[ansible_facts['distribution_release']]
              | default(amneziawg_debian_ppa_suite_default) }}

- name: Report the chosen PPA suite
  ansible.builtin.debug:
    msg: "{{ ansible_distribution }} {{ ansible_facts['distribution_release'] }}
      -> PPA suite {{ amneziawg__ppa_suite }}"

- name: Install the PPA signing key
  # Fetched by fingerprint rather than trusting whatever a keyserver hands
  # back for a name.
  ansible.builtin.get_url:
    url: "{{ amneziawg_ppa_key_url }}"
    dest: "{{ amneziawg_ppa_keyring }}"
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Add the AmneziaWG repository
  ansible.builtin.deb822_repository:
    name: amnezia-ppa
    types: [deb]
    uris: "{{ amneziawg_ppa_uri }}"
    suites: ["{{ amneziawg__ppa_suite }}"]
    components: [main]
    signed_by: "{{ amneziawg_ppa_keyring }}"
    state: present
    enabled: true
  become: true
  register: amneziawg__repo_added

- name: Refresh the package list after adding the repository
  when: amneziawg__repo_added is changed
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install AmneziaWG packages
  ansible.builtin.apt:
    name: '{{ amneziawg_debian_packages }}'
    state: '{{ amneziawg_state }}'
    update_cache: true
  become: true
  register: amneziawg__packages_installed

- name: Check if AmneziaWG DKMS module is built for current kernel
  ansible.builtin.stat:
    path: '/lib/modules/{{ ansible_facts["kernel"] }}/updates/dkms/amneziawg.ko'
  register: amneziawg__dkms_module

- name: Build AmneziaWG DKMS module if not present
  when: not amneziawg__dkms_module.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    dkms install amneziawg/1.0.0 -k {{ ansible_facts["kernel"] }} 2>&1 || \
    dkms autoinstall -k {{ ansible_facts["kernel"] }} 2>&1
  args:
    executable: /bin/bash
  become: true
  register: amneziawg__dkms_build
  changed_when: "'Installing' in amneziawg__dkms_build.stdout or 'Building' in amneziawg__dkms_build.stdout"

- name: Ensure AmneziaWG kernel module is loaded
  community.general.modprobe:
    name: amneziawg
    state: present
  become: true
