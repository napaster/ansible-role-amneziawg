---
# tasks/install-debian.yml - Install AmneziaWG on Debian/Ubuntu via PPA

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - software-properties-common
      - gpg
      - dkms
    state: present
    update_cache: '{{ amneziawg_update_cache }}'
  become: true

- name: Check if kernel headers for current kernel are available
  ansible.builtin.shell: |
    set -euo pipefail
    apt-get install --dry-run 'linux-headers-{{ ansible_facts["kernel"] }}' 2>&1 | grep -q 'is already the newest version\|will be installed'
  args:
    executable: /bin/bash
  register: amneziawg__kernel_headers_available
  failed_when: false
  changed_when: false
  become: true

- name: Install kernel headers for current kernel
  when: amneziawg__kernel_headers_available.rc == 0
  ansible.builtin.apt:
    name: 'linux-headers-{{ ansible_facts["kernel"] }}'
    state: present
  become: true

- name: Install generic kernel headers if current kernel headers unavailable
  when: amneziawg__kernel_headers_available.rc != 0
  block:
    - name: Install linux-generic package for kernel and headers
      ansible.builtin.apt:
        name:
          - linux-generic
          - linux-headers-generic
        state: present
      become: true

    - name: Get latest installed kernel version
      ansible.builtin.shell: |
        set -euo pipefail
        ls -1 /lib/modules/ | sort -V | tail -1
      args:
        executable: /bin/bash
      register: amneziawg__latest_kernel
      changed_when: false

    - name: Check if reboot is required for new kernel
      ansible.builtin.set_fact:
        amneziawg__reboot_required: "{{ ansible_facts['kernel'] != amneziawg__latest_kernel.stdout }}"

    - name: Fail if reboot required but auto_reboot is disabled
      when:
        - amneziawg__reboot_required | bool
        - not amneziawg_auto_reboot | bool
      ansible.builtin.fail:
        msg: |
          Kernel upgrade required: {{ ansible_facts['kernel'] }} -> {{ amneziawg__latest_kernel.stdout }}
          A reboot is needed to load the new kernel before AmneziaWG DKMS module can be built.
          Please reboot the system manually and re-run the playbook, or set amneziawg_auto_reboot: true

    - name: Reboot to load new kernel if required
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.reboot:
        msg: "Rebooting to load new kernel for AmneziaWG DKMS"
        reboot_timeout: 300
      become: true

    - name: Wait for system to come back online
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Gather facts after reboot
      when:
        - amneziawg__reboot_required | bool
        - amneziawg_auto_reboot | bool
      ansible.builtin.setup:

# Ubuntu and Debian need different sources, and conflating them is how this
# silently failed before. `add-apt-repository ppa:` talks to Launchpad and
# exists only on Ubuntu; on Debian it is either absent or a no-op, and the
# packages then come from nowhere.
- name: Add AmneziaWG PPA repository (Ubuntu)
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.apt_repository:
    repo: '{{ amneziawg_ubuntu_ppa }}'
    state: present
    filename: amneziawg
  become: true

# Debian has no upstream repository of its own. Point amneziawg_apt_repo at
# whatever source the host should use -- a mirror of the PPA, a private repo,
# or a locally built one -- together with its signing key. Refusing to guess
# beats adding a source that resolves to nothing.
- name: Add AmneziaWG repository (Debian)
  when:
    - ansible_distribution != 'Ubuntu'
    - amneziawg_apt_repo | length > 0
  block:
    - name: Install the repository signing key
      when: amneziawg_apt_key_url | length > 0
      ansible.builtin.get_url:
        url: '{{ amneziawg_apt_key_url }}'
        dest: '{{ amneziawg_apt_key_path }}'
        mode: '0644'
      become: true

    - name: Add the repository
      ansible.builtin.apt_repository:
        repo: '{{ amneziawg_apt_repo }}'
        state: present
        filename: amneziawg
      become: true

- name: Fail when Debian has no repository configured
  when:
    - ansible_distribution != 'Ubuntu'
    - amneziawg_apt_repo | length == 0
  ansible.builtin.fail:
    msg: "amneziawg: on Debian there is no upstream repository to add. Set
      amneziawg_apt_repo (and amneziawg_apt_key_url) to the source this host
      should use, or set amneziawg_install: false if the packages are already
      installed."

- name: Install AmneziaWG packages
  ansible.builtin.apt:
    name: '{{ amneziawg_debian_packages }}'
    state: '{{ amneziawg_state }}'
    update_cache: true
  become: true
  register: amneziawg__packages_installed

- name: Check if AmneziaWG DKMS module is built for current kernel
  ansible.builtin.stat:
    path: '/lib/modules/{{ ansible_facts["kernel"] }}/updates/dkms/amneziawg.ko'
  register: amneziawg__dkms_module

- name: Build AmneziaWG DKMS module if not present
  when: not amneziawg__dkms_module.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    dkms install amneziawg/1.0.0 -k {{ ansible_facts["kernel"] }} 2>&1 || \
    dkms autoinstall -k {{ ansible_facts["kernel"] }} 2>&1
  args:
    executable: /bin/bash
  become: true
  register: amneziawg__dkms_build
  changed_when: "'Installing' in amneziawg__dkms_build.stdout or 'Building' in amneziawg__dkms_build.stdout"

- name: Ensure AmneziaWG kernel module is loaded
  community.general.modprobe:
    name: amneziawg
    state: present
  become: true
